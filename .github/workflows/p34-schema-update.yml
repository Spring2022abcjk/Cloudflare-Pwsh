name: P3.4 schema update validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p34-schema-update
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  validate-pinned-schema:
    name: Validate pinned schema update
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/p34-windows-baseline
      - name: Validate pinned schema and isolated update chain
        run: ./tools/Invoke-P34SchemaUpdateValidation.ps1
      - name: Upload schema-update reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p34-schema-update-validation
          path: ./artifacts/p34-schema-update-validation
          if-no-files-found: error
          retention-days: 14
